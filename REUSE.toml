#
# Only files that cannot carry a header are named here: the upstream LICENSE
# texts shipped beside each skill. There is deliberately no "**" table: a file
# without its own header must fail `reuse lint`.

version = 1

# The root licence text and files that cannot carry a header of their own.
[[annotations]]
path = ["LICENSE", ".gitignore", "renovate.json", "tools/census-sources.json", "tools/eval-tasks.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

# Written by `praetorctl adopt` and held in step by `praetorctl audit`.
# "closest" keeps the terms a generated file states itself.
[[annotations]]
path = [
    ".agents/**",
    ".claude/**",
    ".codex/**",
    ".config/**",
    ".cursor/**",
    ".devcontainer/**",
    ".fleet/**",
    ".gemini/**",
    ".github/**",
    ".helix/**",
    ".idea/**",
    ".paperclip/**",
    ".vscode/**",
    ".zed/**",
    "docs/**",
    "lua/**",
    ".clang-tidy",
    ".dir-locals.el",
    ".editorconfig",
    ".gitattributes",
    ".nvim.lua",
    ".standards-baseline.json",
    ".standards.lock",
    ".standards.yaml",
    ".windsurfrules",
    "AGENTS.md",
    "AGENTS.readonly.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "Makefile",
    "SECURITY.md",
    "lefthook.yml",
    "standards.sublime-project",
    "tools/figures/**",
    "tools/markdownlint/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

# The figure tools vendor interfig, and the committed player bundles it with
# React, react-dom and scheduler. Both tables mirror the engine's own REUSE.toml
# and must stay after the table above: when several tables match a file, the
# last one decides.
[[annotations]]
path = ["tools/figures/third_party/interfig/upstream/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Vectorize AI, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["tools/figures/dist/**"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Lusoris <lusoris@proton.me>",
    "2025 Vectorize AI, Inc.",
    "Meta Platforms, Inc. and affiliates",
]
SPDX-License-Identifier = "EUPL-1.2 AND MIT"

