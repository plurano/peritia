---
# SPDX-FileCopyrightText: 2026 Lusoris <lusoris@pm.me>
# SPDX-License-Identifier: EUPL-1.2
# The user-scope installer (tools/install_user_skills.py) on every desktop
# system. Its selftest installs a fixture release, plants a collision, a
# changed file, an added file and a missing link, and checks each refusal and
# a clean uninstall. On Windows it runs with symbolic links and again with
# directory junctions (PERITIA_LINK_MODE=junction): a machine without
# developer mode takes that path, and the hosted runner allows symlinks, so
# the selftest forces it there.
name: Installer

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['tools/install_user_skills.py', '.github/workflows/installer.yml']
  push:
    branches: ['main']
    paths: ['tools/install_user_skills.py', '.github/workflows/installer.yml']
  merge_group:

permissions:
  contents: read

env:
  # This workflow builds no engine; the Git hooks read the declaration
  # so local commits are judged by the engine the repository was
  # adopted with.
  PRAETOR_REF: "d9cb68ca1ea1b2f18eee354e54596696c875a04d"

jobs:
  selftest:
    name: Installer selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'
      - name: Run the installer selftest
        if: github.event.pull_request.draft != true
        shell: bash
        run: python -B tools/install_user_skills.py selftest
