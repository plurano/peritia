---
version: 1
repository:
  owner: plurano
  name: peritia
  visibility: "public"
  description: "Peritia: one library of expert agent skills (methodology and domain experts), adapted from upstream with pin, licence and credit per skill"
  homepage: ""
  topics: []
profiles:
  - template-seed
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
register:
  sources:
    expected: 13
    sha256:
      sha256:bae7c17912f7d873769ddeae9dce1cf267e94eedd838228a219463bf5cb35efa
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: HISS-11
    path: .github/workflows/release.yml
    reason: adoption found the release workflows short of the declared supply chain (SLSA Build Level 3 declared, Level 0 measured; enforce_cosign without a cosign signing step; require_sbom without an SBOM step); raise them as docs/guides/releasing.md in Praetor describes, then remove this entry
    expires: "2027-01-13"
  - rule: declared-linters
    tool: gitleaks
    reason: adoption scaffolds no CI job for gitleaks declared by facet "security:high"; run it in a workflow, or remove this entry
    expires: "2027-01-13"
  - rule: declared-linters
    tool: semgrep
    reason: adoption scaffolds no CI job for semgrep declared by profile "template-seed", facet "agent:sandboxed"; run it in a workflow, or remove this entry
    expires: "2027-01-13"
  - rule: declared-linters
    tool: trivy
    reason: adoption scaffolds no CI job for trivy declared by facet "security:high"; run it in a workflow, or remove this entry
    expires: "2027-01-13"

# Standard overrides only increase strictness. The explicit review mode below
# permits single-maintainer operation; all other gates stay enforced.
overrides:
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    # Owner-approved 2026-10-09 (solo-repository policy): restore independent when a
    # maintainer or review bot can approve. Keep the required count so restoration
    # retains the minimum.
    review_mode: single_maintainer
    dismiss_stale_reviews: true

    # Declared at its live value; the forge default is the stricter one.
    require_extra_approval_for_unattributed_changes: true