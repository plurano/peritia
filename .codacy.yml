# Codacy reads this file from the default branch for every analysis, and a pull request's
# changes to it apply to that pull request's analysis too
# (https://docs.codacy.com/repositories-configure/codacy-configuration-file/, read 2026-11-01).
# Once it exists, ignored-files settings in the Codacy UI no longer apply: every exclusion
# lives here, one narrow pattern per judged false positive, each naming its verdict.
engines:
  markdownlint:
    exclude_paths:
      # MD024 (no duplicate headings): this repository lints Markdown with
      # tools/markdownlint/markdownlint-cli2.yaml, where MD024 is siblings_only: true, so a
      # heading repeated under a different parent is the declared style. The adopted reference
      # guides repeat section names such as checklists and examples under each topic (28
      # findings on pull request 27). The repository's own Markdown gate still lints these files.
      # Verdict: FACT peritia-decided-codacy-trial-verdict-27-md024.
      - "skills/*/reference/**"
  agentlinter:
    exclude_paths:
      # skill-safety dangerous-commands: the XSS prevention guide names eval(), new Function()
      # and 'unsafe-eval' as patterns a reviewer refuses (5 findings on pull request 27); the
      # guide runs nothing. Verdict: FACT peritia-decided-codacy-trial-verdict-27-xss-eval.
      - "skills/code-review-skill/reference/cross-cutting/xss-prevention.md"
  opengrep:
    exclude_paths:
      # javascript path traversal (non-literal fs filename): a pattern rule that fires on every
      # variable path. normalize.mjs resolves each path and refuses anything outside the root
      # (exit 2); test_normalize.mjs proves both sides and runs in make test (17 findings on
      # pull request 27). Verdict: FACT peritia-decided-codacy-trial-verdict-27-path-traversal.
      - "tools/markdownlint/normalize.mjs"
      - "tools/markdownlint/test_normalize.mjs"
      # python dangerous subprocess use: the adoption tests start node and git with a fixed
      # argument list, by full path from shutil.which, on test input (2 findings).
      # Verdict: FACT peritia-decided-codacy-trial-verdict-27-test-subprocess.
      - "tools/test_adopt_skills.py"
  bandit:
    exclude_paths:
      # B603 subprocess without shell: same calls as the opengrep entry above (2 findings).
      # Verdict: FACT peritia-decided-codacy-trial-verdict-27-test-subprocess.
      - "tools/test_adopt_skills.py"
  prospector:
    exclude_paths:
      # Prospector's bandit plugin repeats the B603 finding above (2 findings); Ruff still lints
      # this file. Verdict: FACT peritia-decided-codacy-trial-verdict-27-test-subprocess.
      - "tools/test_adopt_skills.py"
